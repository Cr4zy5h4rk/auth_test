<div class="profile-container">
  <div class="header">
      <h1>Welcome {{userInfo?.firstName}} {{userInfo?.lastName}}</h1>
  </div>

  <div *ngIf="status === Status.LOADING" class="loading">
      <div class="spinner"></div>
      <p>Loading, please wait...</p>
  </div>

  <div *ngIf="status === Status.LOADED" class="profile-card">
      <div class="profile-image">
          <img [src]="userInfo?.picture" alt="User">
      </div>
      <div class="profile-details">
          <div class="detail">
              <span class="label">Email:</span>
              <span class="value">{{userInfo?.email}}</span>
          </div>
          <div class="detail">
              <span class="label">Date of Birth:</span>
              <span class="value">{{userInfo?.birthDate}}</span>
          </div>
          <div class="detail">
              <span class="label">Phone:</span>
              <span class="value">{{userInfo?.phoneNumber}}</span>
          </div>
      </div>
  </div>

  <div *ngIf="status === Status.ERROR" class="error">
      <p>Oops, there was an error. Please try again later.</p>
  </div>
</div>
